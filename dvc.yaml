stages:
  ingest:
    cmd: python -m src.catops.data.ingest
    deps:
      - src/catops/data/ingest.py
    outs:
      - data/processed/cat
      - data/processed/not_cat

  validate:
    cmd: python src/catops/data/validate.py
    deps:
      - src/catops/data/validate.py
      - data/processed/cat
      - data/processed/not_cat
    outs:
      - data/processed/metadata.csv

  features:
    cmd: python -m src.catops.features.build_features
    deps:
      - src/catops/features/build_features.py
      - configs/data.yaml
      - data/processed/metadata.csv
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
      - data/processed/features_config.json

  train:
    cmd: python -m src.catops.training.train
    deps:
      - src/catops/training/train.py
      - configs/config.yaml
      - configs/training.yaml
      - configs/model.yaml
      - data/processed/features_config.json
    outs:
      - models/best_model.pt
