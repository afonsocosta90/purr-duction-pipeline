name: CI/CD Pipeline - Am I a Cat?

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'dvc.yaml'
              - 'configs/**'
            docker:
              - 'docker/**'
              - 'demo/**'
              - 'src/**'
              - 'pyproject.toml'
              - 'poetry.lock'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.0

      - name: Install dependencies
        run: |
          poetry install --no-root
          poetry run pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run linters & formatters
        run: poetry run make lint

      - name: Run tests
        run: poetry run make test

  pipeline:
    needs: [quality, changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.0

      - name: Install dependencies
        run: |
          poetry install --no-root
          poetry run pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Configure DVC remote
        run: |
          poetry run dvc remote add -d dagshub https://dagshub.com/afonsocosta90/purr-duction-pipeline.dvc --force
          poetry run dvc remote modify dagshub auth basic
          poetry run dvc remote modify dagshub user ${{ secrets.DAGSHUB_USER }}
          poetry run dvc remote modify dagshub password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull DVC data
        run: poetry run dvc pull

      - name: Verify DagsHub MLflow auth
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "Token length: ${#DAGSHUB_TOKEN}"
          curl -s -o /dev/null -w "%{http_code}" \
            -u "${DAGSHUB_TOKEN}:${DAGSHUB_TOKEN}" \
            "https://dagshub.com/afonsocosta90/purr-duction-pipeline.mlflow/api/2.0/mlflow/experiments/get-by-name?experiment_name=am-i-a-cat"

      - name: Reproduce full pipeline
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/afonsocosta90/purr-duction-pipeline.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: poetry run make pipeline

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-model
          path: models/best_model.pt

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: artifacts/

  docker:
    needs: [quality, changes]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/purr-duction-pipeline:latest
            ghcr.io/${{ github.repository_owner }}/purr-duction-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile.demo
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/purr-duction-pipeline-demo:latest
            ghcr.io/${{ github.repository_owner }}/purr-duction-pipeline-demo:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/purr-duction-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
