name: CI/CD Pipeline - Am I a Cat?

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.0

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run linters & formatters
        run: poetry run make lint

      - name: Run tests
        run: poetry run make test

  pipeline:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.0

      - name: Install dependencies
        run: poetry install --no-root

      - name: Pull DVC data
        run: poetry run dvc pull

      - name: Reproduce full pipeline
        run: poetry run make pipeline

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-model
          path: models/best_model.pt

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: artifacts/

  docker:
    needs: pipeline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/purr-duction-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
